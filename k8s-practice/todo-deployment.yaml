apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
        - name: todo
          image: ghcr.io/chandramohanm069-debug/todo-practice:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URL
              # Pods find each other by Service name,
              # not by IP or "localhost"
              value: mongodb://mongo-service:27017/todos
---
apiVersion: v1
kind: Service
metadata:
  name: todo-service
spec:
  type: NodePort
  selector:
    app: todo
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
